<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Settings</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span>W</span><strong>WeightFlow</strong></a>
    <nav>
      <a class="nav-link" href="/communication"><span>C</span>Communication Settings</a>
      <a class="nav-link" href="/shifts"><span>S</span>Shift Settings</a>
      <a class="nav-link" href="/melt-settings"><span>M</span>Melt Number Settings</a>
      <a class="nav-link" href="/images"><span>P</span>Product Master</a>
      <a class="nav-link" href="/users"><span>U</span>Users</a>
      <a class="nav-link" href="/"><span>H</span>Main Screen</a>
      <a class="nav-link" href="/logs"><span>L</span>Logs</a>
      <form class="logout-form" action="/logout" method="post"><button type="submit">Logout</button></form>
    </nav>
  </aside>
  <main class="shell with-sidebar device-settings-page">
    <header><h1>Device Settings</h1></header>
    <div class="device-tabs" role="tablist" aria-label="Device settings">
      <button class="tab active" id="device-tab" type="button" role="tab" aria-controls="device-panel" aria-selected="true">Device</button>
      <button class="tab" id="backup-tab" type="button" role="tab" aria-controls="backup-panel" aria-selected="false">USB Backup</button>
    </div>
    <section class="panel device-settings-panel" id="device-panel" role="tabpanel" aria-labelledby="device-tab">
      <form class="device-settings-form" id="device-settings-form">
        <div class="field"><label for="pi-serial">Raspberry Pi serial number</label><input id="pi-serial" readonly value="Loading..."></div>
        <div class="field"><label for="device-id">Device ID</label><input id="device-id" name="device_id" type="text" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" autocomplete="off" required></div>
        <div class="field"><label for="device-location">Located at</label><input id="device-location" name="location" maxlength="120" autocomplete="off" required></div>
        <div class="field"><label for="installed-date">Installed date</label><input id="installed-date" name="installed_date" type="date" required></div>
        <div class="device-settings-actions"><div class="form-message" id="device-settings-message" role="status" hidden></div><button class="primary" type="submit">Save</button></div>
      </form>
    </section>
    <section class="panel device-settings-panel backup-panel" id="backup-panel" role="tabpanel" aria-labelledby="backup-tab" hidden>
      <div class="backup-heading"><h2>Report backup</h2><button class="ghost" id="refresh-usb" type="button" title="Refresh USB drives">Refresh drives</button></div>
      <form id="usb-backup-form" class="usb-backup-form">
        <div class="field backup-drive-field"><label for="backup-drive">USB drive</label><select id="backup-drive" required><option value="">Checking connected drives...</option></select></div>
        <div class="field"><label for="backup-from-date">From date</label><input id="backup-from-date" type="date" required></div>
        <div class="field"><label for="backup-to-date">To date</label><input id="backup-to-date" type="date" required></div>
        <div class="field"><label for="backup-shift">Shift</label><select id="backup-shift"></select></div>
        <div class="field"><label for="backup-furnace">Furnace</label><select id="backup-furnace"></select></div>
        <div class="field"><label for="backup-range-type">Time range</label><select id="backup-range-type"><option value="shift">Full day or shift</option><option value="custom">Custom time</option></select></div>
        <div class="field backup-time-field" hidden><label for="backup-start-time">From time</label><input id="backup-start-time" type="time" value="00:00"></div>
        <div class="field backup-time-field" hidden><label for="backup-end-time">To time</label><input id="backup-end-time" type="time" value="23:59"></div>
        <div class="backup-actions"><div class="form-message" id="backup-message" role="status" aria-live="polite" hidden></div><button class="primary" id="backup-submit" type="submit" disabled>Back up CSV + PDF</button></div>
      </form>
    </section>
  </main>
  <div class="powered-by">Powered by <strong>Weider Weighing and Automations</strong></div>
  <script src="{{ url_for('static', filename='device_settings.js', v='5') }}"></script>
  <script src="{{ url_for('static', filename='fullscreen.js', v='4') }}" data-admin="true"></script>
  <script src="{{ url_for('static', filename='keyboard.js') }}"></script>
</body>
</html>
