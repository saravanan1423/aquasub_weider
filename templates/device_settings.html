<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Settings</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span>W</span><strong>WeightFlow</strong></a>
    <nav>
      <a class="nav-link" href="/communication"><span>C</span>Communication Settings</a>
      <a class="nav-link" href="/shifts"><span>S</span>Shift Settings</a>
      <a class="nav-link" href="/melt-settings"><span>M</span>Melt Number Settings</a>
      <a class="nav-link" href="/images"><span>P</span>Product Master</a>
      <a class="nav-link" href="/users"><span>U</span>Users</a>
      <a class="nav-link" href="/"><span>H</span>Main Screen</a>
      <a class="nav-link" href="/logs"><span>L</span>Logs</a>
      <form class="logout-form" action="/logout" method="post"><button type="submit">Logout</button></form>
    </nav>
  </aside>
  <main class="shell with-sidebar device-settings-page">
    <header><h1>Device Settings</h1></header>
    <div class="device-tabs" role="tablist" aria-label="Device settings">
      <button class="tab active" id="device-tab" type="button" role="tab" aria-controls="device-panel" aria-selected="true">Device</button>
      <button class="tab" id="wifi-tab" type="button" role="tab" aria-controls="wifi-panel" aria-selected="false">Wi-Fi</button>
    </div>
    <section class="panel device-settings-panel" id="device-panel" role="tabpanel" aria-labelledby="device-tab">
      <form class="device-settings-form" id="device-settings-form">
        <div class="field"><label for="pi-serial">Raspberry Pi serial number</label><input id="pi-serial" readonly value="Loading..."></div>
        <div class="field"><label for="device-id">Device ID</label><input id="device-id" name="device_id" type="text" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" autocomplete="off" required></div>
        <div class="field"><label for="device-location">Located at</label><input id="device-location" name="location" maxlength="120" autocomplete="off" required></div>
        <div class="field"><label for="installed-date">Installed date</label><input id="installed-date" name="installed_date" type="date" required></div>
        <div class="device-settings-actions"><div class="form-message" id="device-settings-message" role="status" hidden></div><button class="primary" type="submit">Save</button></div>
      </form>
    </section>
    <section class="panel device-settings-panel wifi-panel" id="wifi-panel" role="tabpanel" aria-labelledby="wifi-tab" hidden>
      <div class="wifi-heading"><h2 id="wifi-current-network">Wi-Fi</h2><div class="status disconnected" id="wifi-status"><span></span><strong>Checking...</strong></div><button class="icon-button" id="wifi-refresh" type="button" title="Refresh Wi-Fi networks" aria-label="Refresh Wi-Fi networks">&#8635;</button></div>
      <dl class="wifi-details"><div><dt>Interface</dt><dd id="wifi-interface">-</dd></div><div><dt>Wi-Fi IP address</dt><dd id="wifi-ip-address">-</dd></div><div><dt>Saved auto-connect</dt><dd id="wifi-current-auto">-</dd></div></dl>
      <form class="wifi-form" id="wifi-form">
        <div class="field"><label for="wifi-network">Network</label><select id="wifi-network"><option value="">Select network</option><option value="manual">Other / hidden network</option></select></div>
        <div class="field"><label for="wifi-password">Password</label><div class="login-password-control"><input id="wifi-password" type="password" autocomplete="new-password"><button class="password-visibility-toggle" id="wifi-password-toggle" type="button" title="Show password" aria-label="Show password" aria-pressed="false"><span class="password-visibility-icon" aria-hidden="true"></span></button></div></div>
        <div class="field wifi-manual-field" hidden><label for="wifi-ssid">Network name (SSID)</label><input id="wifi-ssid" maxlength="32" autocomplete="off"></div>
        <div class="wifi-options"><label class="wifi-toggle"><input id="wifi-autoconnect" type="checkbox" checked>Auto-connect on startup</label><label class="wifi-toggle wifi-manual-field" hidden><input id="wifi-hidden" type="checkbox" checked>Hidden network</label></div>
        <div class="wifi-actions"><button class="ghost" id="wifi-save-auto" type="button" disabled>Save auto-connect</button><button class="primary" id="wifi-connect" type="submit" disabled>Connect</button></div>
      </form>
      <div class="form-message" id="wifi-message" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <div class="powered-by">Powered by <strong>Weider Weighing and Automations</strong></div>
  <script src="{{ url_for('static', filename='device_settings.js', v='7') }}"></script>
  <script src="{{ url_for('static', filename='fullscreen.js', v='5') }}" data-admin="true"></script>
  <script src="{{ url_for('static', filename='keyboard.js') }}"></script>
</body>
</html>
