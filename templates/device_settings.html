<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Settings</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='theme.css', v='1') }}">
</head>
<body>
  {% include 'navigation.html' %}
  <main class="shell with-sidebar device-settings-page">
    <header class="device-settings-heading"><h1>Device Settings</h1><div class="header-actions"><a class="settings-back" href="/settings"><i class="ui-icon" style="--icon:url('/static/icons/arrow-left.svg')" aria-hidden="true"></i>Back</a><button class="ghost" id="show-top-bar" type="button" title="Open Raspberry Pi desktop top bar"><span class="top-bar-icon" aria-hidden="true"></span>Open top bar</button></div></header>
    <section class="panel device-settings-panel" id="device-panel">
      <form class="device-settings-form" id="device-settings-form">
        <div class="field"><label for="pi-serial">Raspberry Pi serial number</label><input id="pi-serial" readonly value="Loading..."></div>
        <div class="field"><label for="device-id">Device ID</label><input id="device-id" name="device_id" type="text" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" autocomplete="off" required></div>
        <div class="field"><label for="device-location">Located at</label><input id="device-location" name="location" maxlength="120" autocomplete="off" required></div>
        <div class="field"><label for="installed-date">Installed date</label><input id="installed-date" name="installed_date" type="date" required></div>
        <div class="field"><label for="connected-ip">Connected IP address</label><input id="connected-ip" readonly value="Checking..."></div>
        <div class="device-settings-actions"><div class="form-message" id="device-settings-message" role="status" hidden></div><button class="primary" type="submit">Save</button></div>
      </form>
    </section>
    <div class="form-message" id="top-bar-message" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="{{ url_for('static', filename='device_settings.js', v='8') }}"></script>
  <script src="{{ url_for('static', filename='fullscreen.js', v='6') }}" data-admin="true"></script>
  <script src="{{ url_for('static', filename='keyboard.js') }}"></script>
</body>
</html>
