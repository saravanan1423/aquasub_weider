<aside class="sidebar" id="main-navigation">
  <a class="brand" href="{{ '/material-allocation' if user_default_screen == 'allocation' and can_access('allocation') and not can_access('main') else '/' if can_access('main') else '/material-allocation' if can_access('allocation') else '/settings' if can_access_settings else '/logs' }}" aria-label="Weider | Aqua Group">{% include 'brand_logo.html' %}</a>
  <nav aria-label="Main navigation">
    {% if can_access('main') %}<a class="nav-link{{ ' active' if request.path == '/' else '' }}" href="/" title="Main Screen"><i class="ui-icon" style="--icon:url('/static/icons/house.svg')" aria-hidden="true"></i><b>Main Screen</b></a>{% endif %}
    {% if can_access('allocation') %}<a class="nav-link{{ ' active' if request.path == '/material-allocation' else '' }}" href="/material-allocation" title="Melt Material Allocation"><i class="ui-icon" style="--icon:url('/static/icons/package.svg')" aria-hidden="true"></i><b>Material Allocation</b></a>{% endif %}
    {% if can_access('logs') %}<a class="nav-link{{ ' active' if request.path == '/logs' else '' }}" href="/logs" title="Logs"><i class="ui-icon" style="--icon:url('/static/icons/logs.svg')" aria-hidden="true"></i><b>Logs</b></a>{% endif %}
    {% if can_access_settings %}<a class="nav-link settings-nav-link{{ ' active' if request.path not in ['/', '/logs', '/material-allocation'] else '' }}" href="/settings" title="Settings"><i class="ui-icon" style="--icon:url('/static/icons/settings.svg')" aria-hidden="true"></i><b>Settings</b></a>{% endif %}
    <form class="logout-form" action="/logout" method="post"><button type="submit" title="Logout"><i class="ui-icon" style="--icon:url('/static/icons/log-out.svg')" aria-hidden="true"></i><b>Logout</b></button></form>
  </nav>
</aside>
<link rel="stylesheet" href="{{ url_for('static', filename='branding.css', v='6') }}">
<script>document.documentElement.dataset.keyboard = "{{ 'true' if keyboard_enabled else 'false' }}";</script>
{% if request.path in ['/', '/communication'] %}<script src="{{ url_for('static', filename='scale_status.js', v='3') }}" data-raw-scale-page="{{ 'true' if request.path == '/communication' else 'false' }}"></script>{% endif %}
