<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melt Number Settings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css', v='1') }}">
</head>

<body>
  {% include 'navigation.html' %}
  <main class="shell with-sidebar melt-settings-page">
    <header><a class="settings-back" href="/settings"><i class="ui-icon"
          style="--icon:url('/static/icons/arrow-left.svg')" aria-hidden="true"></i>Back</a></header>
    <section class="panel melt-number-settings">
      {% if is_admin %}
      <div class="capture-display-settings">
        <h2>Capture screen</h2>
        <form id="capture-display-form">
          <div class="field"><label for="success-display-seconds">Display duration (seconds)</label><input
              id="success-display-seconds" name="success_display_seconds" type="number" min="1" max="300" step="1"
              value="10" required></div>
          <button class="primary" type="submit">Save</button>
        </form>
        <div class="shift-message" id="capture-display-message" role="status" hidden></div>
      </div>
      <div class="melt-threshold-settings">
        <h2>Weight thresholds</h2>
        <form class="melt-threshold-form" id="melt-threshold-form">
          <div class="field"><label for="individual-threshold">Individual capture limit (kg)</label><input
              id="individual-threshold" name="individual_threshold_kg" type="number" min="0.001" max="999999999.999"
              step="0.001"></div>
          <div class="field"><label for="melt-threshold">Total melt limit (kg)</label><input id="melt-threshold"
              name="melt_threshold_kg" type="number" min="0.001" max="999999999.999" step="0.001"></div>
          <button class="primary" type="submit">Save</button>
        </form>
        <div class="shift-message" id="melt-threshold-message" role="status" hidden></div>
      </div>
      {% endif %}
      <div class="melt-settings-list" id="melt-settings-list">
        <p class="gallery-empty">Loading furnaces...</p>
      </div>
      <div class="shift-message" id="melt-settings-message" hidden></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='melt_number_settings.js', v='3') }}"></script>
  <script src="{{ url_for('static', filename='fullscreen.js', v='6') }}"
    data-admin="{{ 'true' if is_admin else 'false' }}"></script>
  <script src="{{ url_for('static', filename='keyboard.js') }}"></script>
</body>

</html>
